[project]
name = "aissist-context"
version = "0.1.0"
description = "Context Engine Architecture - Ontology, Graphiti & Neo4j"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "graphiti-core[anthropic,google-genai]>=0.29.3",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "neo4j>=5.18.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

