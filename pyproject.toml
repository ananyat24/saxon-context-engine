[project]
name = "saxon-context-engine"
version = "0.1.0"
description = "Saxon AI Context Engine - ontology-guided temporal context engine for enterprise AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "graphiti-core[anthropic,google-genai]>=0.29.3",
    # See requirements.txt for why this is pinned below 1.0.
    "anthropic<1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "neo4j>=5.18.0",
    "python-dotenv>=1.0.1",
    "google-auth[requests]>=2.30.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "apscheduler>=3.10.0",
    # Encrypts OAuth refresh tokens at rest for the "google_drive_oauth"
    # connector type -- see app/graph/token_crypto.py.
    "cryptography>=42.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not real_llm'"
markers = [
    "real_llm: needs a real Neo4j AND a real LLM (costs money, can be slow/flaky) -- excluded from the default run, opt in with `pytest -m real_llm`.",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

